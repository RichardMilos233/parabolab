name: parabolab
channels:
  - defaults
dependencies:
  - python=3.11
  - numpy
  - matplotlib
  - pytest
  - sympy
  - pip
  - pip:
      # CPU build by default (M4 deep branching solver); the code is
      # device-agnostic -- pass device="cuda" on a machine with a CUDA
      # torch build to run on GPU.
      - torch
      - -e .
